<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1120" viewBox="0 0 1100 1120" role="img" aria-labelledby="title description">
  <title id="title">Protótipo — modelos do Azy Agent com fallback</title>
  <desc id="description">Tela de configuração ROOT do Azy Agent com disponibilidade do tenant, resumo de governança e lista ordenada de três modelos. Cada modelo mostra provider, nome, credencial mascarada, validação e controles acessíveis para ordem, edição, ativação e remoção.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #64748b; }
      .dark { fill: #0f172a; }
      .small { font-size: 13px; }
      .label { font-size: 14px; font-weight: 600; }
      .outline { fill: #fff; stroke: #dbe2ea; }
    </style>
  </defs>
  <rect width="1100" height="1040" fill="#f8fafc"/>

  <g transform="translate(82 54)">
    <text x="0" y="17" font-size="12" font-weight="700" letter-spacing="1.8" fill="#0f766e">ROOT · CONFIGURAÇÃO DO TENANT</text>
    <text x="0" y="58" class="dark" font-size="32" font-weight="750">Azy Agent</text>
    <text x="0" y="86" class="muted" font-size="15">Configure disponibilidade, limites e modelos usados pelo agente.</text>

    <!-- Disponibilidade global -->
    <rect x="0" y="116" width="936" height="108" rx="16" fill="#fff" stroke="#dbe2ea" filter="url(#shadow)"/>
    <text x="24" y="151" class="dark" font-size="16" font-weight="700">Disponibilidade do Azy Agent</text>
    <text x="24" y="178" class="muted" font-size="14">O agente fica disponível quando há pelo menos um modelo ativo e validado.</text>
    <rect x="790" y="143" width="112" height="28" rx="14" fill="#ccfbf1"/>
    <circle cx="808" cy="157" r="5" fill="#0f766e"/>
    <text x="821" y="162" font-size="12" font-weight="700" fill="#115e59">DISPONÍVEL</text>
    <rect x="884" y="183" width="30" height="17" rx="9" fill="#0f766e"/>
    <circle cx="904" cy="191.5" r="6.5" fill="#fff"/>

    <!-- Governança resumida -->
    <rect x="0" y="244" width="936" height="106" rx="16" fill="#fff" stroke="#dbe2ea" filter="url(#shadow)"/>
    <text x="24" y="277" class="dark" font-size="16" font-weight="700">Governança</text>
    <text x="24" y="302" class="muted" font-size="13">Os limites atuais continuam valendo para toda a cadeia de modelos.</text>
    <text x="24" y="329" font-size="13" font-weight="600" fill="#334155">10 req/min</text>
    <text x="149" y="329" font-size="13" font-weight="600" fill="#334155">3 runs/tenant</text>
    <text x="292" y="329" font-size="13" font-weight="600" fill="#334155">90 s por inferência</text>
    <text x="442" y="329" font-size="13" font-weight="600" fill="#334155">Limites de custo e tokens</text>
    <text x="860" y="307" class="small" font-weight="700" fill="#0f766e">Editar limites</text>

    <!-- Modelos -->
    <text x="0" y="405" class="dark" font-size="20" font-weight="750">Modelos de execução</text>
    <text x="0" y="430" class="muted" font-size="14">A lista define a prioridade: se um provider falhar, o próximo modelo ativo é tentado.</text>
    <rect x="0" y="448" width="936" height="54" rx="12" fill="#ecfeff" stroke="#a5f3fc"/>
    <circle cx="24" cy="475" r="9" fill="#cffafe"/>
    <text x="24" y="479" text-anchor="middle" font-size="12" font-weight="800" fill="#0e7490">i</text>
    <text x="44" y="472" font-size="13" font-weight="650" fill="#155e75">Fallback sequencial</text>
    <text x="44" y="490" font-size="12" fill="#155e75">A ordem é respeitada; cada modelo é tentado no máximo uma vez por chamada, sem repetir tools já concluídas.</text>

    <!-- Modelo primário -->
    <rect x="0" y="518" width="936" height="126" rx="14" fill="#fff" stroke="#99f6e4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="538" width="34" height="34" rx="10" fill="#ccfbf1"/>
    <text x="33" y="561" text-anchor="middle" font-size="14" font-weight="800" fill="#0f766e">1</text>
    <text x="66" y="548" class="dark" font-size="15" font-weight="750">GPT-4.1</text>
    <rect x="145" y="531" width="80" height="23" rx="11.5" fill="#ccfbf1"/>
    <text x="185" y="547" text-anchor="middle" font-size="10" font-weight="800" letter-spacing=".5" fill="#115e59">PRIMÁRIO</text>
    <text x="66" y="574" class="muted" font-size="12">OPENAI · API key ••••••7kP2</text>
    <circle cx="75" cy="608" r="4" fill="#16a34a"/>
    <text x="87" y="612" font-size="12" font-weight="650" fill="#15803d">Validado agora</text>
    <rect x="740" y="535" width="140" height="28" rx="14" fill="#f1f5f9"/>
    <circle cx="757" cy="549" r="4" fill="#16a34a"/>
    <text x="770" y="553" font-size="11" font-weight="700" fill="#334155">ATIVO</text>
    <rect x="892" y="535" width="32" height="28" rx="8" class="outline"/>
    <circle cx="902" cy="549" r="1.5" fill="#475569"/><circle cx="908" cy="549" r="1.5" fill="#475569"/><circle cx="914" cy="549" r="1.5" fill="#475569"/>
    <rect x="672" y="584" width="34" height="34" rx="9" class="outline"/>
    <path d="M689 606v-11m0 0-4 4m4-4 4 4" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="713" y="584" width="34" height="34" rx="9" class="outline"/>
    <path d="M730 595v11m0 0-4-4m4 4 4-4" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="754" y="584" width="70" height="34" rx="9" class="outline"/>
    <text x="789" y="606" text-anchor="middle" font-size="12" font-weight="650" fill="#334155">Editar</text>
    <rect x="830" y="584" width="80" height="34" rx="9" fill="#0f766e"/>
    <text x="870" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Testar</text>

    <!-- Fallback 1 -->
    <rect x="0" y="656" width="936" height="126" rx="14" fill="#fff" stroke="#dbe2ea" filter="url(#shadow)"/>
    <rect x="16" y="676" width="34" height="34" rx="10" fill="#f1f5f9"/>
    <text x="33" y="699" text-anchor="middle" font-size="14" font-weight="800" fill="#475569">2</text>
    <text x="66" y="686" class="dark" font-size="15" font-weight="750">Claude Sonnet 4</text>
    <rect x="66" y="697" width="189" height="23" rx="11.5" fill="#f1f5f9"/>
    <text x="160" y="713" text-anchor="middle" font-size="10" font-weight="800" letter-spacing=".5" fill="#475569">FALLBACK 1 · OPENROUTER</text>
    <text x="66" y="744" class="muted" font-size="12">anthropic/claude-sonnet-4 · API key ••••••R4w9</text>
    <circle cx="75" cy="763" r="4" fill="#16a34a"/>
    <text x="87" y="767" font-size="12" font-weight="650" fill="#15803d">Validado hoje às 09:42</text>
    <rect x="740" y="673" width="140" height="28" rx="14" fill="#f1f5f9"/>
    <circle cx="757" cy="687" r="4" fill="#16a34a"/>
    <text x="770" y="691" font-size="11" font-weight="700" fill="#334155">ATIVO</text>
    <rect x="892" y="673" width="32" height="28" rx="8" class="outline"/>
    <circle cx="902" cy="687" r="1.5" fill="#475569"/><circle cx="908" cy="687" r="1.5" fill="#475569"/><circle cx="914" cy="687" r="1.5" fill="#475569"/>
    <rect x="672" y="722" width="34" height="34" rx="9" class="outline"/>
    <path d="M689 744v-11m0 0-4 4m4-4 4 4" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="713" y="722" width="34" height="34" rx="9" class="outline"/>
    <path d="M730 733v11m0 0-4-4m4 4 4-4" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="754" y="722" width="70" height="34" rx="9" class="outline"/>
    <text x="789" y="744" text-anchor="middle" font-size="12" font-weight="650" fill="#334155">Editar</text>
    <rect x="830" y="722" width="80" height="34" rx="9" fill="#fff" stroke="#dbe2ea"/>
    <text x="870" y="744" text-anchor="middle" font-size="12" font-weight="650" fill="#334155">Testar</text>

    <!-- Fallback 2 -->
    <rect x="0" y="794" width="936" height="126" rx="14" fill="#fff" stroke="#dbe2ea" filter="url(#shadow)"/>
    <rect x="16" y="814" width="34" height="34" rx="10" fill="#f1f5f9"/>
    <text x="33" y="837" text-anchor="middle" font-size="14" font-weight="800" fill="#475569">3</text>
    <text x="66" y="824" class="dark" font-size="15" font-weight="750">GPT-4.1 mini</text>
    <rect x="66" y="835" width="148" height="23" rx="11.5" fill="#f1f5f9"/>
    <text x="140" y="851" text-anchor="middle" font-size="10" font-weight="800" letter-spacing=".5" fill="#475569">FALLBACK 2 · OPENAI</text>
    <text x="66" y="882" class="muted" font-size="12">API key ••••••7kP2</text>
    <circle cx="75" cy="901" r="4" fill="#16a34a"/>
    <text x="87" y="905" font-size="12" font-weight="650" fill="#15803d">Validado hoje às 09:42</text>
    <rect x="740" y="811" width="140" height="28" rx="14" fill="#f1f5f9"/>
    <circle cx="757" cy="825" r="4" fill="#16a34a"/>
    <text x="770" y="829" font-size="11" font-weight="700" fill="#334155">ATIVO</text>
    <rect x="892" y="811" width="32" height="28" rx="8" class="outline"/>
    <circle cx="902" cy="825" r="1.5" fill="#475569"/><circle cx="908" cy="825" r="1.5" fill="#475569"/><circle cx="914" cy="825" r="1.5" fill="#475569"/>
    <rect x="672" y="860" width="34" height="34" rx="9" class="outline"/>
    <path d="M689 882v-11m0 0-4 4m4-4 4 4" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="713" y="860" width="34" height="34" rx="9" class="outline"/>
    <path d="M730 871v11m0 0-4-4m4 4 4-4" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="754" y="860" width="70" height="34" rx="9" class="outline"/>
    <text x="789" y="882" text-anchor="middle" font-size="12" font-weight="650" fill="#334155">Editar</text>
    <rect x="830" y="860" width="80" height="34" rx="9" fill="#fff" stroke="#dbe2ea"/>
    <text x="870" y="882" text-anchor="middle" font-size="12" font-weight="650" fill="#334155">Testar</text>

    <!-- Adicionar e privacidade -->
    <rect x="0" y="936" width="936" height="52" rx="12" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <circle cx="34" cy="962" r="12" fill="#ccfbf1"/>
    <path d="M34 956v12m-6-6h12" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round"/>
    <text x="56" y="967" font-size="14" font-weight="700" fill="#0f766e">Adicionar modelo</text>
    <text x="0" y="1018" class="muted" font-size="12">Chaves armazenadas cifradas. Apenas o prefixo mascarado e o estado de validação aparecem nesta lista.</text>
  </g>
</svg>
