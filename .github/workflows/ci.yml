name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE: ~/.bun/install/cache

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Check (typecheck + lint + testes + build)
        run: bun run check
      - name: Publicar diagnóstico do check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-diagnostics
          if-no-files-found: ignore
          path: |
            **/dist/**
            apps/api/dev.db

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: i18n
        run: bun run check:i18n
      - name: Catálogo MCP
        run: bun run test:mcp-catalog
      - name: Skill de agente
        run: bun run test:agent-skill
      - name: Migrations
        run: bun run test:migrations
      - name: Integridade da documentação
        run: bun run check:docs
      - name: Build do web (orçamento de bundle)
        run: bun run build:web
      - name: Orçamento de bundle
        run: bun run check:bundle

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: /tmp/azy-ci-smoke.db
      AZYBOARD_INSTALL_PROFILE: SIMPLE
      AZYBOARD_INSTANCE_DIR: /tmp/azy-ci-smoke-state
      JWT_SECRET: ci-smoke-secret-not-for-production
      NODE_ENV: test
      PORT: "3001"
      FRONTEND_URL: http://localhost:5173
      AZYBOARD_API_TARGET: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Aplicar migrations
        run: bun run db:migrate
      - name: Subir API
        run: |
          mkdir -p tmp/ci
          bun run --cwd apps/api src/index.ts > tmp/ci/azy-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3001/api/auth/me; then
              echo "API respondeu na tentativa $i"
              exit 0
            fi
            sleep 1
          done
          echo "API não respondeu em 60s"
          cat tmp/ci/azy-api.log
          exit 1
      - name: Subir Web
        run: |
          bun run dev:web > tmp/ci/azy-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:5173; then
              echo "Web respondeu na tentativa $i"
              exit 0
            fi
            sleep 1
          done
          echo "Web não respondeu em 60s"
          cat tmp/ci/azy-web.log
          exit 1
      - name: Smoke test
        run: bun run test:smoke
      - name: Publicar logs
        if: failure()
        run: |
          echo "=== API ==="
          cat tmp/ci/azy-api.log || true
          echo "=== WEB ==="
          cat tmp/ci/azy-web.log || true
      - name: Publicar artefatos de diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          if-no-files-found: ignore
          path: |
            tmp/ci/azy-api.log
            tmp/ci/azy-web.log

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      # Força o Chromium empacotado do Playwright (instalado no job).
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Instalar Chromium do Playwright
        run: bunx playwright install --with-deps chromium
      - name: Política de testes de frontend
        run: bun run check:frontend-tests
      - name: E2E de navegador
        run: bun run test:e2e
      - name: Regressão visual (observação inicial)
        continue-on-error: true
        run: bun run test:visual
      - name: Publicar artefatos de diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          path: |
            tmp/e2e-failures/**
            tmp/visual-diffs/**

  advanced:
    name: advanced (PostgreSQL + Valkey)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azyboard
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: azyboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azyboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping | grep PONG"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      AZYBOARD_INSTALL_PROFILE: ADVANCED
      DATABASE_URL: postgresql://azyboard:ci-password@localhost:5432/azyboard
      REDIS_URL: redis://localhost:6379
      AZYBOARD_INSTANCE_DIR: /tmp/azy-ci-advanced-state
      JWT_SECRET: ci-advanced-secret-not-for-production
      NODE_ENV: test
      TEST_PG_URL: postgresql://azyboard:ci-password@localhost:5432/azyboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Migrations PostgreSQL
        run: |
          bun run --cwd apps/api -e "
            const { readFileSync } = require('fs')
            const { join } = require('path')
            const { Pool } = require('pg')
            const pool = new Pool({ connectionString: process.env.DATABASE_URL })
            const dir = join('apps/api/src/db/postgres/migrations')
            for (const f of ['0000_pale_warlock.sql', '0001_composite_fks.sql']) {
              await pool.query(readFileSync(join(dir, f), 'utf8'))
            }
            await pool.end()
            console.log('Migrations PostgreSQL aplicadas.')
          "
      - name: Testes de migrations PostgreSQL
        run: bun test apps/api/src/db/postgres/migrations.test.ts
      - name: Testes de paridade SIMPLE ↔ ADVANCED
        run: bun test apps/api/src/db/postgres/parity.test.ts
      - name: Testes de coordenação (local)
        run: bun test apps/api/src/coordination/local.test.ts
