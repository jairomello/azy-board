name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE: ~/.bun/install/cache

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Check (typecheck + lint + testes + build)
        run: bun run check
      - name: Publicar diagnóstico do check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-diagnostics
          if-no-files-found: ignore
          path: |
            **/dist/**
            apps/api/dev.db

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: i18n
        run: bun run check:i18n
      - name: Catálogo MCP
        run: bun run test:mcp-catalog
      - name: Skill de agente
        run: bun run test:agent-skill
      - name: Migrations
        run: bun run test:migrations
      - name: Integridade da documentação
        run: bun run check:docs
      - name: Build do web (orçamento de bundle)
        run: bun run build:web
      - name: Orçamento de bundle
        run: bun run check:bundle

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: /tmp/azy-ci-smoke.db
      AZYBOARD_INSTALL_PROFILE: SIMPLE
      AZYBOARD_INSTANCE_DIR: /tmp/azy-ci-smoke-state
      JWT_SECRET: ci-smoke-secret-not-for-production
      NODE_ENV: test
      PORT: "3001"
      FRONTEND_URL: http://localhost:5173
      AZYBOARD_API_TARGET: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Aplicar migrations
        run: bun run db:migrate
      - name: Subir API
        run: |
          mkdir -p tmp/ci
          bun run --cwd apps/api src/index.ts > tmp/ci/azy-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3001/api/auth/me; then
              echo "API respondeu na tentativa $i"
              exit 0
            fi
            sleep 1
          done
          echo "API não respondeu em 60s"
          cat tmp/ci/azy-api.log
          exit 1
      - name: Subir Web
        run: |
          bun run dev:web > tmp/ci/azy-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:5173; then
              echo "Web respondeu na tentativa $i"
              exit 0
            fi
            sleep 1
          done
          echo "Web não respondeu em 60s"
          cat tmp/ci/azy-web.log
          exit 1
      - name: Smoke test
        run: bun run test:smoke
      - name: Publicar logs
        if: failure()
        run: |
          echo "=== API ==="
          cat tmp/ci/azy-api.log || true
          echo "=== WEB ==="
          cat tmp/ci/azy-web.log || true
      - name: Publicar artefatos de diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          if-no-files-found: ignore
          path: |
            tmp/ci/azy-api.log
            tmp/ci/azy-web.log

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      # Força o Chromium empacotado do Playwright (instalado no job).
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Instalar Chromium do Playwright
        run: bunx playwright install --with-deps chromium
      - name: Política de testes de frontend
        run: bun run check:frontend-tests
      - name: E2E de navegador
        run: bun run test:e2e
      - name: Regressão visual (observação inicial)
        continue-on-error: true
        run: bun run test:visual
      - name: Publicar artefatos de diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          path: |
            tmp/e2e-failures/**
            tmp/visual-diffs/**
            tmp/e2e-logs/**

  advanced:
    name: advanced (PostgreSQL + Valkey)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azyboard
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: azyboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azyboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping | grep PONG"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      AZYBOARD_INSTALL_PROFILE: ADVANCED
      DATABASE_URL: postgresql://azyboard:ci-password@localhost:5432/azyboard
      REDIS_URL: redis://localhost:6379
      AZYBOARD_INSTANCE_DIR: /tmp/azy-ci-advanced-state
      JWT_SECRET: ci-advanced-secret-not-for-production
      NODE_ENV: test
      TEST_PG_URL: postgresql://azyboard:ci-password@localhost:5432/azyboard_test
      PORT: "3002"
      UPLOADS_DIR: /tmp/azy-ci-advanced-uploads
      FRONTEND_URL: http://localhost:5173
      AZYBOARD_API_TARGET: http://localhost:3002
      SMOKE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Criar banco de testes isolado
        run: PGPASSWORD=ci-password createdb -h localhost -U azyboard azyboard_test
      - name: Testes de boot/import por perfil
        run: bun test apps/api/src/boot/boot-profile.test.ts
      - name: Testes de migrations PostgreSQL
        run: bun test apps/api/src/db/postgres/migrations.test.ts
      - name: Migrations legadas (dados pré-T37 preservados)
        run: bun test apps/api/src/db/postgres/legacy-migrations.test.ts
      - name: Testes de paridade SIMPLE ↔ ADVANCED
        run: bun test apps/api/src/db/postgres/parity.test.ts
      - name: Jornada HTTP ADVANCED (dois tenants, RBAC)
        run: bun test apps/api/src/advanced-http.test.ts
      - name: Agente ADVANCED (provider determinístico, tool/aprovação/SSE)
        run: bun test apps/api/src/advanced-agent.test.ts
      - name: Worker ADVANCED fenced (dois workers reais, lease expirado)
        run: bun test apps/api/src/advanced-worker-fence.test.ts
      - name: Rollout/rollback ADVANCED (redeploy e marcador)
        run: bun test apps/api/src/advanced-rollout.test.ts
      - name: Testes de coordenação (local)
        run: bun test apps/api/src/coordination/local.test.ts
      - name: Migrations PostgreSQL da instalação (runner do perfil)
        run: bun run --cwd apps/api db:migrate:pg
      - name: Reexecutar migrations (ensaio de rollout idempotente)
        run: bun run --cwd apps/api db:migrate:pg
      - name: Setup CLI ADVANCED (tenant/admin)
        run: |
          bun run --cwd apps/api src/scripts/setup.ts \
            "CI Advanced" "ci-advanced" "admin@ci-advanced.test" "SenhaForte123!" "CI Admin"
      - name: Subir API ADVANCED real
        run: |
          mkdir -p tmp/ci "$UPLOADS_DIR"
          bun run --cwd apps/api src/index.ts > tmp/ci/advanced-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3002/health/ready; then
              echo "API ADVANCED respondeu na tentativa $i"
              exit 0
            fi
            sleep 1
          done
          echo "API ADVANCED não respondeu em 60s"
          cat tmp/ci/advanced-api.log
          exit 1
      - name: Subir Web real
        run: |
          bun run dev:web > tmp/ci/advanced-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:5173; then
              echo "Web respondeu na tentativa $i"
              exit 0
            fi
            sleep 1
          done
          echo "Web não respondeu em 60s"
          cat tmp/ci/advanced-web.log
          exit 1
      - name: Smoke ADVANCED (web + API PostgreSQL/Valkey)
        run: bun run test:smoke
      - name: Publicar logs sanitizados
        if: failure()
        run: |
          echo "=== API ADVANCED ==="
          cat tmp/ci/advanced-api.log || true
          echo "=== WEB ==="
          cat tmp/ci/advanced-web.log || true
      - name: Publicar artefatos de diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-logs
          if-no-files-found: ignore
          path: |
            tmp/ci/advanced-api.log
            tmp/ci/advanced-web.log

  image:
    name: image (deploy reproduzível)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Coerência da versão do Bun no deploy
        run: bun run check:deploy-versions
      - name: Validar compose files
        run: |
          docker compose -f docker-compose.simple.yml config -q
          docker compose -f docker-compose.advanced.yml config -q
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: azyboard-api:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build da imagem Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          tags: azyboard-web:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Teste automatizado de restore (SIMPLE)
        run: bun run test:restore
      - name: Diagnóstico
        if: failure()
        run: docker ps -a
